<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel Post — Island Mail Run</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1622; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #panel { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  #menu {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 18, 30, 0.55); font-family: Georgia, 'Times New Roman', serif; color: #f3e9d2;
  }
  #menu .card {
    max-width: 620px; width: calc(100% - 48px); background: rgba(13, 26, 40, 0.92);
    border: 1px solid #c8a24a; border-radius: 10px; padding: 26px 30px; box-shadow: 0 18px 60px rgba(0,0,0,0.5);
  }
  #menu h1 { margin: 0 0 2px; font-size: 34px; letter-spacing: 1px; color: #f6d67c; }
  #menu h2 { margin: 0 0 14px; font-size: 15px; font-weight: normal; letter-spacing: 3px; color: #9fc3e0; text-transform: uppercase; }
  #menu p { margin: 8px 0; font-size: 15px; line-height: 1.45; }
  #menu .missions { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  #menu button {
    font-family: inherit; text-align: left; cursor: pointer; border-radius: 6px;
    border: 1px solid #5b7b99; background: #16283c; color: #f3e9d2; padding: 10px 14px; font-size: 15px;
  }
  #menu button:hover { border-color: #f6d67c; background: #1d344e; }
  #menu button b { color: #f6d67c; }
  #menu button.chosen { border-color: #f6d67c; background: #27435f; }
  #menu .fly { text-align: center; font-size: 19px; letter-spacing: 2px; background: #7a2e22; border-color: #d98a6a; }
  #menu .fly:hover { background: #93392a; }
  #menu .keys { font-size: 13px; color: #b9cbdc; line-height: 1.6; }
  #menu .keys span { color: #f6d67c; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Kestrel Post: a 3D mail-plane flight game over an island archipelago"></canvas>
<canvas id="panel"></canvas>
<div id="menu"></div>
<p id="status" role="status" aria-live="polite"></p>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
